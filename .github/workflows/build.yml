name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
# One publish at a time, so two quick pushes can't race on the release.
concurrency:
  group: publish-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unlock the signing key
        env:
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
        run: |
          if [ -z "$FOLIO_SIGNING_PASSWORD" ]; then
            echo "::error::Add the FOLIO_SIGNING_PASSWORD secret (Settings > Secrets and variables > Actions) so builds are signed with Folio's key."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/folio.jks.enc -out "$RUNNER_TEMP/folio.jks" -pass env:FOLIO_SIGNING_PASSWORD
          echo "FOLIO_KEYSTORE=$RUNNER_TEMP/folio.jks" >> "$GITHUB_ENV"
      # The on-phone AI voices run on sherpa-onnx. Its Kotlin side lives in the app
      # (com.k2fsa.sherpa.onnx.Tts.kt); this fetches the matching native libraries.
      - name: Get the speech library
        run: |
          V=1.12.40
          mkdir sherpa
          if curl -fsSL -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-v$V-android.tar.bz2"; then
            tar xjf sherpa.tar.bz2 -C sherpa
          else
            curl -fsSL -o sherpa.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-$V.aar"
            unzip -q sherpa.aar -d sherpa
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          find sherpa -path '*arm64-v8a*' -name '*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -la app/src/main/jniLibs/arm64-v8a
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
      - name: Check the AI voice downloads
        run: |
          for id in kokoro-int8-en-v0_19 vits-piper-en_US-lessac-medium vits-piper-en_GB-alba-medium kitten-nano-en-v0_1-fp16; do
            size=$(curl -sIL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$id.tar.bz2" | grep -i '^content-length' | tail -1 | tr -dc 0-9)
            echo "$id ${size:-missing}"
          done
      - run: ./gradlew assembleDebug
        env:
          FOLIO_SIGNING_PASSWORD: ${{ secrets.FOLIO_SIGNING_PASSWORD }}
      # Published as a release asset (not an Actions artifact) so it's one tap to
      # download on a phone and doesn't count against Actions storage.
      - name: Publish APK to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk folio-debug.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build folio-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Folio (latest build)" \
            --notes "Debug APK built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download folio-debug.apk on your phone and open it to install."
