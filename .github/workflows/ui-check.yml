name: UI check
# Run by hand only (Actions tab, "Run workflow"): new builds are tested on a phone.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: Parts of the tour to run, as a JSON list
        default: '["reading","listening","freebooks","files"]'
permissions:
  contents: write
jobs:
  emulator:
    # The tour is split into parts that run side by side on separate emulators.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    name: emulator (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Off the default branch the Gradle cache is read-only unless told otherwise.
          cache-read-only: false
      - run: ./gradlew assembleDebug
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Booting from a saved snapshot takes seconds instead of minutes. The snapshot is made
      # once (with the text-to-speech engine already installed) and cached.
      # Restored and saved as separate steps, so the cache holds the emulator as set up here
      # and never its state after a test run (actions/cache would save that at the job's end).
      - name: Restore the emulator snapshot
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-pixel_6-espeak-v2
      - name: Make the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disk-size: 2048M
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-setup.sh
      - name: Save the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-pixel_6-espeak-v2
      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disk-size: 2048M
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash .github/scripts/ui-check.sh
        env:
          PART: ${{ matrix.part }}
      # Screenshots go to a "ui-check-shots-<part>" branch per part (Actions artifacts are
      # over quota, and creating releases from this job has been refused with HTTP 403).
      - name: Publish screenshots
        if: always()
        run: |
          ls -la shots || exit 0
          BRANCH=ui-check-shots-${{ matrix.part }}
          cd shots
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "UI check screenshots (${{ matrix.part }}) for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
