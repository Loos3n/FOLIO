name: UI check
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/ui-check.sh
      # Screenshots go on a release (not an Actions artifact, which is over quota).
      - name: Publish screenshots to the "ui-check" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || exit 0
          gh release delete ui-check --yes --cleanup-tag || true
          gh release create ui-check shots/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "UI check screenshots" \
            --notes "Emulator screenshots of the debug build from ${GITHUB_SHA::7}."
